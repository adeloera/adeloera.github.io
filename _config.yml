# Site settings
title: Andrés de Loera
email: andresdeloera@stanford.edu
description: >-
  Andrés de Loera is an Assistant Professor of Oceans at the Stanford Doerr School of
  Sustainability and leads the Ocean Policy Lab. Natural resource economics, with a
  particular focus on the ocean.
baseurl: ""
url: ""

lab_name: Ocean Policy Lab
lab_url: https://oceanpolicy.stanford.edu/

# Google Analytics / Tag Manager IDs: uncomment and fill in to enable tracking
# google_analytics_4: G-XXXXXXXXXX
# google_tag_manager: GTM-XXXXXXX

# Footer text (HTML allowed)
affiliation: >
  Assistant Professor of Oceans<br/>
  Stanford Doerr School of Sustainability<br/>
  Center Fellow, Center on Food Security and the Environment

location: >
  Oceans Department<br/>
  Stanford University<br/>
  Stanford, CA 94305

contact: >
  <a href="mailto:andresdeloera@stanford.edu">andresdeloera@stanford.edu</a><br/>
  <a href="https://oceanpolicy.stanford.edu/" target="_blank" rel="noopener">Ocean Policy Lab website</a>

# Links shown in the navigation bar, in order (Home is always first).
#   newtab: true    opens the link in a new tab
#   external: true  opens in a new tab and marks the link with an arrow
nav_pages:
  - name: Research
    url: /research/
  - name: Teaching
    url: /teaching/
  - name: Blog
    url: /blog/
  - name: CV
    url: /documents/deLoera_cv.pdf
    newtab: true
  - name: Ocean Policy Lab
    url: https://oceanpolicy.stanford.edu/
    external: true

include:
  - .htaccess
  - _pages

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true # lets Markdown be used inside HTML blocks

plugins: ["jekyll/scholar"]

scholar:
  last_name: de Loera
  first_name: [Andrés]

  style: citesty
  locale: en

  source: /assets/
  bibliography: ref.bib
  bibliography_template: bibtemplate
  sort_by: year, month
  order: descending

  replace_strings: true
  join_strings: true

  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details

  query: "@*"

  bibliography_list_attributes:
    reversed: "reversed"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - package.json
  - update_bootstrap.sh
  - tags
  - .claude
  - _cv
